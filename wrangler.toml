name = "bucla-verde-demo"
main = "server/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Preview URLs would add public hosts outside config/hosts.json.
preview_urls = false

# Measured on the deployed Worker on 2026-11-12 (README, Known trade-offs).
[vars]
PBKDF2_ITERATIONS = "20000"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__demo/*"]

[[d1_databases]]
binding = "DB"
database_name = "bucla-verde"
database_id = "b36862b5-c057-4fe6-b9f6-87f521432ac7"
migrations_dir = "server/db/migrations"

[triggers]
crons = ["0 1 * * *"]

[observability]
enabled = true
